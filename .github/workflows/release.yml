name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: package binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]
          mkdir -p dist
          for arch in amd64 arm64; do
            package="wraith_${RELEASE_TAG}_linux_${arch}"
            mkdir -p "dist/$package"
            GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" -o "dist/$package/wraith" ./cmd/wraith
            cp README.md LICENSE NOTICE "dist/$package/"
            cp -R docs "dist/$package/"
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          done
          cd dist || exit 1
          sha256sum ./*.tar.gz > checksums.txt
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes --draft
